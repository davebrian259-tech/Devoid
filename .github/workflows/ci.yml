name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.64.0 && python -m playwright install --with-deps chromium
      - name: Drive every screen against the simulated engine
        run: python3 scripts/ui-smoke.py
      - name: Build the site and drive the web demo under its real headers
        run: python3 scripts/web-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-screenshots, path: shots/ }
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: engine }
      - name: Build (no --locked: see README)
        run: cargo build --release --manifest-path engine/Cargo.toml
      - name: Unit tests
        run: cargo test --release --manifest-path engine/Cargo.toml
      - name: Self-test
        run: ./engine/target/release/devoid-engine selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: devoid-engine-linux, path: engine/target/release/devoid-engine, if-no-files-found: ignore }
  web-engine:
    # The engine's browser build (the same wallet code, compiled to WebAssembly). The committed
    # ui/engine/ is rebuilt from it with scripts/build-web-engine.mjs; this keeps it compiling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: web-engine }
      - name: Build for the browser
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path web-engine/Cargo.toml
